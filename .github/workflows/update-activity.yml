# Place this file at: .github/workflows/update-activity.yml
# in your profile repo (aisheeem7/aisheeem7).
# Job 1 fills the "Recent Activity" section of the README.
# Job 2 draws your contribution graph into the "output" branch, which the README displays.

name: Update profile

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: update recent activity"
          MAX_LINES: 5

  contribution-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-graph.svg?color_snake=#7F5AF0
            dist/contribution-graph-dark.svg?palette=github-dark&color_snake=#7F5AF0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
